PLG_CONTENT_CHAOSFILET="Content - Chaos Filet"
PLG_CONTENT_CHAOSFILET_XML_DESCRIPTION="Pulls specific fields from one article into another article or a Custom HTML module, using {article ID:field1,field2} tags. Honors Joomla's access levels and publish state for both the article and its category. See the Documentation tab on this page for the syntax and field reference."

PLG_CONTENT_CHAOSFILET_FIELD_WRAP_OUTPUT_LABEL="Wrap Tag Output"
PLG_CONTENT_CHAOSFILET_FIELD_WRAP_OUTPUT_DESC="Wraps everything one tag outputs in a &lt;div class='cf-filet cf-filet--ID'&gt;, so the group can be styled as a unit (e.g. a card). Skipped automatically when every field in the tag is marked raw with '!'."
PLG_CONTENT_CHAOSFILET_FIELD_EXCERPT_LIMIT_LABEL="Excerpt Limit"
PLG_CONTENT_CHAOSFILET_FIELD_EXCERPT_LIMIT_DESC="How much of the intro text the 'excerpt' field keeps, before it gets cut off with an ellipsis."
PLG_CONTENT_CHAOSFILET_FIELD_EXCERPT_UNIT_LABEL="Excerpt Limit Unit"
PLG_CONTENT_CHAOSFILET_FIELD_EXCERPT_UNIT_DESC="Whether the Excerpt Limit above counts words or characters."
PLG_CONTENT_CHAOSFILET_FIELD_EXCERPT_UNIT_WORDS="Words"
PLG_CONTENT_CHAOSFILET_FIELD_EXCERPT_UNIT_CHARACTERS="Characters"
PLG_CONTENT_CHAOSFILET_FIELD_DATE_FORMAT_LABEL="Date Format"
PLG_CONTENT_CHAOSFILET_FIELD_DATE_FORMAT_DESC="Format for the 'date' and 'modified' fields. Either a Joomla language key such as DATE_FORMAT_LC3 (follows the site language) or DATE_FORMAT_LC4, or a PHP date format such as 'j F Y' or 'Y-m-d'."
PLG_CONTENT_CHAOSFILET_FIELD_CARD_HEADING_LABEL="Card Heading Level"
PLG_CONTENT_CHAOSFILET_FIELD_CARD_HEADING_DESC="The heading level for the article title in the |card layout. Pick the level that fits under the heading the cards sit beneath, so the page outline stays in order. It looks the same at every level."
PLG_CONTENT_CHAOSFILET_FIELD_LAZY_IMAGES_LABEL="Lazy-load Images"
PLG_CONTENT_CHAOSFILET_FIELD_LAZY_IMAGES_DESC="Adds loading='lazy' and decoding='async' to pulled-in images. Turn off if you use a tag for an image near the top of the page, where lazy-loading delays it."
PLG_CONTENT_CHAOSFILET_FIELD_INCREMENT_HITS_LABEL="Count Embeds as Hits"
PLG_CONTENT_CHAOSFILET_FIELD_INCREMENT_HITS_DESC="When enabled, embedding an article's fields elsewhere increments that article's hit count, once per article per page load. Off by default: a tag placed in a sitewide module would otherwise inflate that article's hit count on every page view, not just visits to the article itself."
PLG_CONTENT_CHAOSFILET_FIELD_PROCESS_PLUGINS_LABEL="Run Content Plugins on Pulled Text"
PLG_CONTENT_CHAOSFILET_FIELD_PROCESS_PLUGINS_DESC="When enabled, intro, fulltext and body text pulled from another article goes through your site's content plugins first (email cloaking, {loadmodule}, and so on), and tags inside that text expand too, up to 3 levels deep. A tag that would loop back to an article already being shown is stopped. Off by default."

PLG_CONTENT_CHAOSFILET_READMORE="Read more"

PLG_CONTENT_CHAOSFILET_NOTE_UNPUBLISHED="[Chaos Filet: source article is unpublished]"
PLG_CONTENT_CHAOSFILET_NOTE_RESTRICTED="[Chaos Filet: source article is access-restricted]"
PLG_CONTENT_CHAOSFILET_NOTE_CATEGORY_UNPUBLISHED="[Chaos Filet: source article's category is unpublished]"
PLG_CONTENT_CHAOSFILET_NOTE_CATEGORY_RESTRICTED="[Chaos Filet: source article's category is access-restricted]"
PLG_CONTENT_CHAOSFILET_NOTE_NOT_FOUND="[Chaos Filet: no article found for '%s']"
PLG_CONTENT_CHAOSFILET_NOTE_LOOP="[Chaos Filet: article %d is already being shown here, so it was skipped to avoid a loop]"
PLG_CONTENT_CHAOSFILET_NOTE_AMBIGUOUS="[Chaos Filet: '%1$s' matches %2$d articles; showing ID %3$d. Use the ID or category-alias/article-alias]"
PLG_CONTENT_CHAOSFILET_NOTE_UNKNOWN_FIELD="[Chaos Filet: unknown field '%s']"
PLG_CONTENT_CHAOSFILET_NOTE_NO_LAYOUT="[Chaos Filet: layout '%s' not found; used the default]"

PLG_CONTENT_CHAOSFILET_FIELDSET_DOCS_LABEL="Documentation"
PLG_CONTENT_CHAOSFILET_DOCS_NOTE_LABEL="Quick Reference"
PLG_CONTENT_CHAOSFILET_DOCS_NOTE_DESC="<p><code>{article REF:field1,field2|layout}</code></p><ul><li><strong>REF</strong>: article ID, alias, or category-alias/article-alias</li><li><strong>Fields</strong> (optional, default <code>body</code>): id, title, alias, url, link, readmore, intro, fulltext, body, excerpt, image, fulltext_image, date, modified, author, category, tags, hits, <code>field:ALIAS</code> (rendered custom field), <code>fieldraw:ALIAS</code> (stored value, escaped)</li><li><strong>Shortcuts</strong>: <code>common</code> (title, image, body, date, author, link) and <code>all</code> (everything, labelled, for debugging)</li><li><strong>Raw</strong>: end a field with <code>!</code> to drop its wrapper div, for use inline or inside an attribute: <code>Read {article 12:link!} next.</code></li><li><strong>Layout</strong> (optional): <code>|card</code> ships with the plugin; add your own in templates/YOUR_TEMPLATE/html/plg_content_chaosfilet/</li><li><strong>Literal tags</strong>: tags inside &lt;code&gt; or &lt;pre&gt; never expand; <code>&#92;{article 12}</code> prints the tag as text anywhere else.</li><li><strong>Modules</strong>: in a Custom HTML module, set Advanced &rarr; Prepare Content = Yes.</li></ul><p>The full reference is the README in the Chaos Filet source download, and the Chaos Filet page on chaoticfishdesign.com.</p>"
